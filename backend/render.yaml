        value: 5bf1bcc4fd7af8fa799152b11d449a2f68ba3dc6e3d7a4b302299eedeb90b40b
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: abuad
      - key: CLOUDFLARE_R2_PUBLIC_DOMAIN
        value: https://pub-0014553a7b194df8b2d31efb7c6f4921.r2.dev
