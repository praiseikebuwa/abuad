<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABUAD Nest - Join the Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B5CF6;
            --primary-dark: #7C3AED;
            --bg: #F9FAFB;
            --text: #111827;
            --text-muted: #6B7280;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F172A;
                --text: #F9FAFB;
                --text-muted: #94A3B8;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .logo {
            display: block;
            margin: 0 auto;
            max-width: 150px;
            width: 100%;
            height: 100%;
            object-fit: cover;
            margin-bottom: 24px;
            border-radius: 50%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease-in-out;
        }

        .logo:hover {
            transform: scale(1.1);
            cursor: pointer;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            font-size: 16px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.4);
        }

        .btn-secondary {
            background-color: rgba(139, 92, 246, 0.1);
            color: var(--primary);
        }

        .btn-secondary:hover {
            background-color: rgba(139, 92, 246, 0.2);
        }

        .footer {
            margin-top: 48px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Micro-animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>

<body>
    <div class="container">
            <img class="logo" src="logo.png" alt="ABUAD Logo">
        
        <h1>Open in ABUAD Nest</h1>
        <p id="description">Join the community, stay updated, and connect with your fellow students.</p>

        <div class="actions">
            <a href="#" id="open-web-btn" class="btn btn-secondary">
  <span>🌐</span> Open in Web
</a>

            <a href="#" id="open-app-btn" class="btn btn-primary">
                <span>🚀</span> Open in App
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.pronown.abuad" class="btn btn-secondary">
                <span>📱</span> Get it on Play Store
            </a>
        </div>

        <div class="footer">
            &copy; 2026 ABUAD App Team
        </div>
    </div>

    <script>
        const path = window.location.pathname;
        const postId = path.split('/').pop();
        
        // Define links
        const universalLink = 'https://abuadapp.web.app' + path;
        const customScheme = 'abuad://' + (path.startsWith('/') ? path.substring(1) : path);
        
        // Android Intent Link (Most robust for Android browser buttons)
        // intent://abuadapp.web.app/post/123#Intent;scheme=https;package=com.pronown.abuad;end
        const androidIntent = `intent://abuadapp.web.app${path}#Intent;scheme=https;package=com.pronown.abuad;S.browser_fallback_url=${encodeURIComponent(universalLink)};end`;

        const openAppBtn = document.getElementById('open-app-btn');
        const openWebBtn = document.getElementById('open-web-btn');
        
        // Detect OS
        const isAndroid = /Android/i.test(navigator.userAgent);
        
        // Prevent infinite reload loop
        const urlParams = new URLSearchParams(window.location.search);
        const noRedirect = urlParams.get('noredirect') === 'true';

        if (isAndroid) {
            // Use noredirect=true for fallback to prevent looping
            const fallbackWithNoRedirect = universalLink + (universalLink.includes('?') ? '&' : '?') + 'noredirect=true';
            openAppBtn.href = `intent://abuadapp.web.app${path}#Intent;scheme=https;package=com.pronown.abuad;S.browser_fallback_url=${encodeURIComponent(fallbackWithNoRedirect)};end`;
        } else {
            openAppBtn.href = customScheme;
        }
        // Fallback for users without the app installed.
        const webPath = path.startsWith('/') ? path : '/' + path;
        openWebBtn.href = 'https://abuadapp.web.app/web/#' + webPath + window.location.search;


        // Auto-redirect logic (only if not already redirected)
        if (postId && postId !== 'post' && postId !== '' && !noRedirect) {
            document.getElementById('description').innerText = "Redirecting you to the app... If it doesn't open automatically, click the button below.";
            
            // Try to auto-open
            setTimeout(() => {
                const finalLink = isAndroid ? openAppBtn.href : customScheme;
                window.location.href = finalLink;
            }, 500);
        }
    </script>
</body>

</html>
