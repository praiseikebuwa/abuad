  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffddb2;
      background-size: 100% 100%;

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;

      right: 0;

    /* ── PWA Install Dialog Styles ───────────────────────────────────────── */
    #pwa-install-dialog {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-24px);
      width: calc(100% - 32px);
      max-width: 440px;

      opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #pwa-install-dialog.pwa-visible {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .pwa-header {

    }

      border-radius: 12px;

    }

    .pwa-text-content {

    .pwa-title {

    }

    .pwa-close-btn {

      border: none;

    }

    .pwa-actions {

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash) {
        splash.style.transition = "opacity 0.3s ease-out";
        splash.style.opacity = "0";
        setTimeout(function() {
          splash.remove();
        }, 300);
      }
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    // 1. Instantly remove splash when Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      removeSplashFromWeb();
    });

    // 2. Also listen for Flutter engine DOM mounting
    const observer = new MutationObserver(function () {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(removeSplashFromWeb, 80);
        observer.disconnect();
      }
    });
    document.addEventListener('DOMContentLoaded', function () {
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>

  <script>
    (function () {
      var deferredPrompt = null;
      var banner = document.getElementById('pwa-install-dialog');
      var btnInstall = document.getElementById('pwa-btn-install');
      var btnContinue = document.getElementById('pwa-btn-continue');
      var btnClose = document.getElementById('pwa-close-x');
      var iosGuide = document.getElementById('ios-install-guide');
      var iosClose = document.getElementById('ios-guide-close');

      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      function hideBanner() {
        if (!banner) return;
        banner.classList.remove('pwa-visible');
        setTimeout(function () {
          banner.style.display = 'none';
        }, 350);
      }

      function showBanner() {
        if (isStandalone) return;
        if (localStorage.getItem('pwa_already_installed') === 'true') return;
        if (sessionStorage.getItem('pwa_dialog_dismissed') === 'true') return;
        if (!banner) return;
        banner.style.display = 'block';
        setTimeout(function () {
          banner.classList.add('pwa-visible');
        }, 50);
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        showBanner();
      });

      // Also trigger banner after 2 seconds for browsers/devices
      setTimeout(function () {
        showBanner();
      }, 2000);

      if (btnInstall) {
        btnInstall.addEventListener('click', function () {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function (choiceResult) {
              if (choiceResult && choiceResult.outcome === 'accepted') {
                localStorage.setItem('pwa_already_installed', 'true');
              }
              deferredPrompt = null;
              hideBanner();
            });
          } else if (isIOS) {
            hideBanner();
            if (iosGuide) iosGuide.classList.add('visible');
          } else {
            // General guidance for browsers without beforeinstallprompt
            hideBanner();
            alert("To install, open your browser menu (⋮ or ...) and select 'Install app' or 'Add to Home Screen'.");
          }
        });
      }

      if (btnContinue) {
        btnContinue.addEventListener('click', function () {
          sessionStorage.setItem('pwa_dialog_dismissed', 'true');
          hideBanner();
        });
      }

      if (btnClose) {
        btnClose.addEventListener('click', function () {
          sessionStorage.setItem('pwa_dialog_dismissed', 'true');
          hideBanner();
        });
      }

      if (iosClose) {
        iosClose.addEventListener('click', function () {
          if (iosGuide) iosGuide.classList.remove('visible');
        });
      }

      window.addEventListener('appinstalled', function () {
        localStorage.setItem('pwa_already_installed', 'true');
        hideBanner();
      });
    })();
  </script>
