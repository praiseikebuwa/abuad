  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0A;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Modern Native Web Splash */
    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      user-select: none;
      -webkit-user-select: none;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-fade-out {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .splash-logo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(20, 184, 166, 0.25));
      animation: logoPulse 2.4s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(0.97);
        opacity: 0.92;
      }
      50% {
        transform: scale(1.03);
        opacity: 1;
        filter: drop-shadow(0 12px 30px rgba(20, 184, 166, 0.4));
      }
    }

    .splash-loader-bar {
      margin-top: 32px;
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-progress {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #14B8A6, #3B82F6);
      border-radius: 6px;
      position: absolute;
      animation: loaderSlide 1.5s ease-in-out infinite;
    }

    @keyframes loaderSlide {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }

    .splash-title {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    /* PWA Install Banner Styles */
    #pwa-install-dialog {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: calc(100% - 32px);
      max-width: 440px;
      background: rgba(24, 24, 27, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      z-index: 10000;
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    #pwa-install-dialog.pwa-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .pwa-header {

      align-items: center;

    }

    .pwa-app-icon {

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      var splash = document.getElementById("splash-container");
      if (splash && !splash.classList.contains("splash-fade-out")) {
        splash.classList.add("splash-fade-out");
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
          document.body.style.background = "transparent";
        }, 460);
      }
    }

    // Watch for Flutter engine mounting its root element into the DOM
    var _splashObserver = new MutationObserver(function () {
      var flt = document.querySelector("flutter-view") || document.querySelector("flt-glass-pane") || document.querySelector("flt-scene-host");
      if (flt) {
        setTimeout(removeSplashFromWeb, 350);
        _splashObserver.disconnect();
      }
    });

    document.addEventListener("DOMContentLoaded", function () {
      _splashObserver.observe(document.body, { childList: true, subtree: true });
    });

    // Fallback safe timeout to guarantee splash removal
    setTimeout(removeSplashFromWeb, 7500);
  </script>

  <script>
    (function () {
      var deferredPrompt = null;
      var banner = document.getElementById('pwa-install-dialog');
      var btnInstall = document.getElementById('pwa-btn-install');
      var btnContinue = document.getElementById('pwa-btn-continue');
      var btnClose = document.getElementById('pwa-close-x');
      var iosGuide = document.getElementById('ios-install-guide');
      var iosClose = document.getElementById('ios-guide-close');

      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      function hideBanner() {
        if (!banner) return;
        banner.classList.remove('pwa-visible');
        setTimeout(function () {
          banner.style.display = 'none';
        }, 350);
      }

      function showBanner() {
        if (isStandalone) return;
        if (localStorage.getItem('pwa_already_installed') === 'true') return;
        if (sessionStorage.getItem('pwa_dialog_dismissed') === 'true') return;
        if (!banner) return;
        banner.style.display = 'block';
        setTimeout(function () {
          banner.classList.add('pwa-visible');
        }, 50);
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
      });

      // Only show PWA banner after app is fully running (6 seconds after load)
      setTimeout(function () {
        showBanner();
      }, 7000);

      if (btnInstall) {
        btnInstall.addEventListener('click', function () {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function (choiceResult) {
              if (choiceResult && choiceResult.outcome === 'accepted') {
                localStorage.setItem('pwa_already_installed', 'true');
              }
              deferredPrompt = null;
              hideBanner();
            });
          } else if (isIOS) {
            hideBanner();
            if (iosGuide) iosGuide.classList.add('visible');
          } else {
            hideBanner();
            alert("To install, open your browser menu (⋮ or ...) and select 'Install app' or 'Add to Home Screen'.");
          }
        });
      }

      if (btnContinue) {
        btnContinue.addEventListener('click', function () {
          sessionStorage.setItem('pwa_dialog_dismissed', 'true');
          hideBanner();
        });
      }

      if (btnClose) {
        btnClose.addEventListener('click', function () {
          sessionStorage.setItem('pwa_dialog_dismissed', 'true');
          hideBanner();
        });
      }

      if (iosClose) {
        iosClose.addEventListener('click', function () {
          if (iosGuide) iosGuide.classList.remove('visible');
        });
      }

      window.addEventListener('appinstalled', function () {
        localStorage.setItem('pwa_already_installed', 'true');
        hideBanner();
      });
    })();
  </script>
